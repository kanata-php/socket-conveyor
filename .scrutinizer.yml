build:
    nodes:
        analysis:
            environment:
                php:
                    version: "8.4.27"
                    pecl_extensions:
                        - openswoole
                apt_packages:
                    - lsof
                    - procps
            dependencies:
                override:
                    - composer install --no-interaction --prefer-dist
                    - composer check-platform-reqs
            project_setup:
                override:
                    - "true"
            tests:
                override:
                    - composer test
                    - php-scrutinizer-run
                    -
                        command: phpcs-run
                        use_website_config: true
filter:
    excluded_paths:
        - "tests/*"
checks:
    php: true
coding_style:
    php:
        spaces:
            around_operators:
                concatenation: true
